name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version, e.g. 1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish module ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          VERSION="${VERSION#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid SemVer version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate manifests
        run: jq empty AirlineLock/module.json AirlineLock/composer.json

      - name: Build module ZIP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf dist
          mkdir -p dist
          cp -R AirlineLock dist/AirlineLock
          cd dist
          zip -r "../anyways-airline-lock-module-${VERSION}.zip" AirlineLock
          cd ..
          sha256sum "anyways-airline-lock-module-${VERSION}.zip" \
            > "anyways-airline-lock-module-${VERSION}.zip.sha256"
          unzip -l "anyways-airline-lock-module-${VERSION}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AirlineLock v${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            anyways-airline-lock-module-${{ steps.version.outputs.version }}.zip
            anyways-airline-lock-module-${{ steps.version.outputs.version }}.zip.sha256